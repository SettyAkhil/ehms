# EHMS production stack. See DEPLOYMENT.md.
#
#   cp .env.example .env && ./deploy/init-env.sh     # generate secrets once
#   docker compose up -d --build                     # core stack
#   docker compose --profile ocr up -d --build       # + Keppler OCR
#
# Only the `web` service publishes a port. Everything else is on the private
# `ehms` network.

name: ehms

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  # ── Data ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: [*restart, *logging, *hardening]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      HMS_DB_PASSWORD: ${HMS_DB_PASSWORD:?set in .env}
      HRMS_DB_PASSWORD: ${HRMS_DB_PASSWORD:?set in .env}
      HR_OWNER_DB_PASSWORD: ${HR_OWNER_DB_PASSWORD:?set in .env}
      OCR_DB_PASSWORD: ${OCR_DB_PASSWORD:?set in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ehms]

  redis:
    image: redis:7-alpine
    <<: [*restart, *logging, *hardening]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [ehms]

  # ── Application ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    image: ehms/backend:latest
    <<: [*restart, *logging, *hardening]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://hms:${HMS_DB_PASSWORD}@postgres:5432/hospai
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      # Background tasks run in-process (same as the local launcher).
      CELERY_TASK_ALWAYS_EAGER: "true"
      SESSION_PEPPER: ${SESSION_PEPPER:?set in .env}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?set in .env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?set in .env}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?set in .env}
      PUBLIC_BASE_URL: ${PUBLIC_URL}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      DEFAULT_HOSPITAL_CODE: ${DEFAULT_HOSPITAL_CODE:-hosp-default}
      SEED_DEMO_USERS: "false"
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_EMBEDDING_URL: ${VLLM_EMBEDDING_URL:-}
      VLLM_EMBEDDING_MODEL: ${VLLM_EMBEDDING_MODEL:-}
      RAG_EMBEDDING_DIM: ${RAG_EMBEDDING_DIM:-1024}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - backend-uploads:/opt/ehms/backend/uploads
      - backend-rag:/opt/ehms/backend/backend/rag_workspaces
    networks: [ehms]

  hrms:
    build:
      context: .
      dockerfile: deploy/hrms.Dockerfile
    image: ehms/hrms:latest
    <<: [*restart, *logging, *hardening]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      HRMS_DATABASE_URL: postgresql://hrms_legacy:${HRMS_DB_PASSWORD}@postgres:5432/hospai_enterprise
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      TZ: ${TZ:-Asia/Kolkata}
    networks: [ehms]

  hr-api:
    build:
      context: .
      dockerfile: deploy/hr-api.Dockerfile
    image: ehms/hr-api:latest
    <<: [*restart, *logging, *hardening]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend: { condition: service_started }
    environment: &hr-env
      HR_DATABASE_URL: postgresql+psycopg://hr_app:${HR_APP_DB_PASSWORD:?set in .env}@postgres:5432/hospai_hr
      HR_DATABASE_OWNER_URL: postgresql+psycopg://hr_owner:${HR_OWNER_DB_PASSWORD}@postgres:5432/hospai_hr
      HR_APP_DB_PASSWORD: ${HR_APP_DB_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      HR_AUTH_SERVICE_URL: http://backend:8010
      HR_GATEWAY_URL: http://backend:8010
      HR_SECRETS_KEY: ${HR_SECRETS_KEY:?set in .env}
      HR_DOCUMENT_ROOT: /data/hr-documents
      HR_TIMEZONE: ${TZ:-Asia/Kolkata}
      SESSION_COOKIE_NAME: hospai_session
      FORWARDED_ALLOW_IPS: "*"
      CELERY_CONCURRENCY: ${HR_CELERY_CONCURRENCY:-2}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - hr-documents:/data/hr-documents
    networks: [ehms]

  hr-worker:
    build:
      context: .
      dockerfile: deploy/hr-api.Dockerfile
    image: ehms/hr-api:latest
    <<: [*restart, *logging, *hardening]
    depends_on:
      hr-api: { condition: service_started }
    environment: *hr-env
    command: ["sh", "-c", "exec celery -A app.worker worker --beat --loglevel=info --concurrency=$${CELERY_CONCURRENCY:-2} --schedule=/tmp/celerybeat-schedule"]
    volumes:
      - hr-documents:/data/hr-documents
    networks: [ehms]

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: ehms/web:latest
    <<: [*restart, *logging]
    depends_on:
      backend: { condition: service_started }
      hrms: { condition: service_started }
    environment:
      VLLM_UPSTREAM: ${VLLM_UPSTREAM:-}
      CLIENT_MAX_BODY_SIZE: 200m
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:80"
    networks: [ehms]

  # ── Keppler OCR (optional: --profile ocr) ───────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    profiles: [ocr]
    <<: [*restart, *logging, *hardening]
    volumes:
      - qdrant:/qdrant/storage
    networks: [ehms]

  ocr-api:
    build:
      context: .
      dockerfile: deploy/ocr.Dockerfile
    image: ehms/ocr:latest
    profiles: [ocr]
    <<: [*restart, *logging, *hardening]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
    environment: &ocr-env
      DATABASE_URL: postgresql+psycopg://ocr:${OCR_DB_PASSWORD}@postgres:5432/keppler
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/4
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET_KEY: ${OCR_JWT_SECRET_KEY:?set in .env}
      UPLOAD_ENCRYPTION_KEY: ${OCR_UPLOAD_ENCRYPTION_KEY:?set in .env}
      UPLOAD_DIR: /opt/ehms/ocr-backend/uploads
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      FORWARDED_ALLOW_IPS: "*"
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ocr-uploads:/opt/ehms/ocr-backend/uploads
      - ocr-models:/opt/ehms/models
    networks: [ehms]

  ocr-worker:
    build:
      context: .
      dockerfile: deploy/ocr.Dockerfile
    image: ehms/ocr:latest
    profiles: [ocr]
    <<: [*restart, *logging, *hardening]
    depends_on:
      ocr-api: { condition: service_started }
    environment: *ocr-env
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    volumes:
      - ocr-uploads:/opt/ehms/ocr-backend/uploads
      - ocr-models:/opt/ehms/models
    networks: [ehms]

networks:
  ehms:
    name: ehms

volumes:
  pgdata:
  redisdata:
  backend-uploads:
  backend-rag:
  hr-documents:
  qdrant:
  ocr-uploads:
  ocr-models:
