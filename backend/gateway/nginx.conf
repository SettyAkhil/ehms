worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # In production the HospAI web server (deploy/) sits in front and passes the
    # real client address in X-Real-IP; trust it from private/Docker networks
    # only, so per-client limits (login, HR API) stay per user rather than
    # lumping the whole hospital behind the web container's address.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;
    # Body size matches the per-service Flask MAX_CONTENT_LENGTH (200MB, for
    # bulk-import / document uploads).
    client_max_body_size 200m;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;

    # Per-client ceiling for the HR API (100 r/s sustained, bursts to 200).
    limit_req_zone $binary_remote_addr zone=hrapi:10m rate=100r/s;

    resolver 127.0.0.11 valid=30s; # Docker's embedded DNS, for upstream re-resolution

    map $upstream_service $upstream_name {
        auth        auth-service:8011;
        patients    patients-service:8012;
        appointments appointments-service:8013;
        er          er-service:8014;
        billing     billing-service:8015;
        pharmacy    pharmacy-service:8016;
        hr          hr-service:8017;
        ai          ai-service:8018;
        reporting   reporting-service:8019;
        hrapi       hr-api:8020;
    }

    server {
        listen 8010;

        # CORS/CSRF/session-cookie handling is done by each Flask service
        # (shared/app_factory.py) -- the gateway is a plain reverse proxy and
        # does not re-terminate those concerns, so cookies/headers pass through
        # untouched to whichever service owns the request.
        #
        # Every location below is deliberately written WITHOUT a trailing
        # slash: nginx prefix-matches substrings regardless (so
        # "/api/patients" still matches both "/api/patients" itself and
        # "/api/patients/PAT-1"), but a location string that ends in "/"
        # triggers nginx's built-in directory auto-redirect for the exact
        # no-trailing-slash request (e.g. plain "GET /api/patients") --
        # and that redirect embeds this server's internal `listen` port
        # (8010) rather than the port the client actually connected on,
        # breaking every bare-prefix route (appointments, patients, employees,
        # ...) through the host-mapped port. Omitting the trailing slash
        # avoids the auto-redirect path entirely.

        location /api/auth      { set $upstream_service auth;        proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/admin     { set $upstream_service auth;        proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/platform  { set $upstream_service auth;        proxy_pass http://$upstream_name; include proxy_params.conf; }

        location /api/patients     { set $upstream_service patients; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/emr          { set $upstream_service patients; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/icu          { set $upstream_service patients; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/ot           { set $upstream_service patients; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/clinical     { set $upstream_service patients; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/documents    { set $upstream_service patients; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/bulk-import  { set $upstream_service patients; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/whatsapp     { set $upstream_service patients; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/messaging    { set $upstream_service patients; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/certificates { set $upstream_service patients; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/registration { set $upstream_service patients; proxy_pass http://$upstream_name; include proxy_params.conf; }
        # No-login patient card page (QR on the OP card). Found by an unguessable
        # per-card token, rate-limited in the service; see public_patient_card().
        location /api/public       { set $upstream_service patients; proxy_pass http://$upstream_name; include proxy_params.conf; }

        location /api/appointments { set $upstream_service appointments; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/op           { set $upstream_service appointments; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/queue        { set $upstream_service appointments; proxy_pass http://$upstream_name; include proxy_params.conf; }

        location /api/er   { set $upstream_service er; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/beds { set $upstream_service er; proxy_pass http://$upstream_name; include proxy_params.conf; }

        location /api/billing  { set $upstream_service billing; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/accounts { set $upstream_service billing; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/payments { set $upstream_service billing; proxy_pass http://$upstream_name; include proxy_params.conf; }

        location /api/pharmacy { set $upstream_service pharmacy; proxy_pass http://$upstream_name; include proxy_params.conf; }

        location /api/hr        { set $upstream_service hr; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/employees { set $upstream_service hr; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/audit     { set $upstream_service hr; proxy_pass http://$upstream_name; include proxy_params.conf; }

        location /api/symptom-ai { set $upstream_service ai; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/ocr-portal { set $upstream_service ai; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/ocr         { set $upstream_service ai; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/ai          { set $upstream_service ai; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/export      { set $upstream_service ai; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/languages   { set $upstream_service ai; proxy_pass http://$upstream_name; include proxy_params.conf; }

        location /api/dashboard { set $upstream_service reporting; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/reports   { set $upstream_service reporting; proxy_pass http://$upstream_name; include proxy_params.conf; }
        location /api/stats     { set $upstream_service reporting; proxy_pass http://$upstream_name; include proxy_params.conf; }

        # HR & Workforce (FastAPI hr-api). Regex locations win over the
        # /api/v1/ prefix below, which still goes to the AI/document backend.
        # The SSE stream comes first: no buffering, long-lived.
        location ~ ^/api/v1/attendance/live/stream$ {
            set $upstream_service hrapi;
            proxy_pass http://$upstream_name;
            include proxy_params.conf;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }
        location ~ ^/api/v1/(hr|attendance|workforce|payroll|recruitment|onboarding|training|performance|compliance|me|reports/hr|facility|team)(/|$) {
            limit_req zone=hrapi burst=200 nodelay;
            limit_req_status 429;
            set $upstream_service hrapi;
            proxy_pass http://$upstream_name;
            include proxy_params.conf;
        }

        # The separate, pre-existing AI/document backend used by
        # SmartOCR/SymptomAI/ClinicalSummaries (untouched, not part of this
        # decomposition) -- reachable from the Docker host via host.docker.internal.
        location /api/v1/ {
            proxy_pass http://host.docker.internal:8000;
            include proxy_params.conf;
        }

        location = /api/health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":true}';
        }

        location /api/ {
            return 404;
        }
    }
}
